name: Deploy to GitHub Pages

# 只在 main 分支推送与手动触发时部署。
on:
  push: { branches: [main] }
  workflow_dispatch:
  # 每日定时重建：刷新构建期抓取的 GitHub 动态数据（star 数、最近提交）与页脚的构建戳。
  # 03:10 UTC = 北京时间 11:10，避开整点的高峰。
  schedule:
    - cron: "10 3 * * *"

# Pages 部署所需的最小权限。
permissions: { contents: read, pages: write, id-token: write }

# 同一时间只跑一个部署；新的推送直接取消排队中的旧任务。
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本取自 package.json 的 packageManager 字段（pnpm@11.25.0），
      # 与本地、锁文件保持一致，避免依赖腐化。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 构建期抓取 GitHub 动态数据需要 token；抓取失败不会中断构建（脚本内部会保留旧数据）
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
